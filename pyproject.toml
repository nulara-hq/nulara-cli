[project]
name = "nulara"
version = "0.1.1"
description = "Nulara command-line access"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "cyclopts>=4.11,<5",
    "httpx>=0.28,<1",
    "keyring>=25.7,<26",
    "rich>=15,<16",
    "tldextract>=5.3,<6",
]

[project.urls]
Homepage = "https://nulara.de"
Documentation = "https://nulara.de/cli"
Source = "https://github.com/nulara-hq/nulara-cli"
Issues = "https://github.com/nulara-hq/nulara-cli/issues"

[project.scripts]
nulara = "nulara:main"

[dependency-groups]
dev = [
    "pyright~=1.1.400",
    "pytest~=9.0.3",
    "pytest-cov~=7.0.0",
    "ruff~=0.14.0",
]

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
branch = true
source = ["nulara"]

[tool.coverage.report]
fail_under = 98
precision = 2
show_missing = true
skip_empty = true
